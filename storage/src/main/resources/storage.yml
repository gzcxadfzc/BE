# 테스트-로컬 (로컬 Mysql DB)
spring.config.activate.on-profile: test-local
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  redis:
    host: 127.0.0.1
    port: 6379

storage:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/little-writer-v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: 7631

---

# 부하 테스트 환경 (load-test 단독 프로파일)
spring.config.activate.on-profile: load-test
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
storage:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: ${JDBC_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    maximum-pool-size: 50
  s3:
    access-key: load-test-dummy
    secret-key: load-test-dummy

sqs:
  queue-url: ${SQS_QUEUE_URL}
  region: ap-northeast-2

---

# 🧩 테스트-인메모리 H2
spring.config.activate.on-profile: test-in-memory
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
        hbm2ddl.auto: create
  redis:
    host: 127.0.0.1
    port: 6379
  h2:
    console:
      enabled: true

storage:
  datasource:
    driver-class-name: org.h2.Driver
    jdbcUrl: jdbc:h2:mem:littlewriter;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: as
    password: sa

---
